name: trends

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect web novel rankings
        run: python tools/trends_crawler.py
      - name: Commit daily snapshot
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "trends: 일일 랭킹 수집 (KST)"
          commit_user_name: "trends-bot"
          commit_user_email: "trends-bot@users.noreply.github.com"
          file_pattern: trends/