<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Graph Viewer</title>
<script src="https://unpkg.com/cytoscape/dist/cytoscape.min.js"></script>
<script src="https://unpkg.com/cytoscape-fcose@2.2.0/cytoscape-fcose.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Malgun Gothic',sans-serif;background:#fafafa;color:#111;height:100vh;display:flex;flex-direction:column;overflow:hidden}
#cy{flex:1;width:100%;background:#fafafa;min-height:0}
.header{
  background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);
  color:#fff;padding:8px 16px;display:flex;justify-content:space-between;align-items:center;flex-shrink:0;flex-wrap:wrap;gap:10px
}
.header h1{font-size:14px;white-space:nowrap}
.header .hint{font-size:11px;opacity:0.8;white-space:nowrap}
#tabs{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tab{padding:6px 14px;border-radius:20px;border:1px solid rgba(255,255,255,0.4);background:rgba(255,255,255,0.15);color:#fff;cursor:pointer;font-size:12px;font-weight:600;transition:all .15s;white-space:nowrap}
.tab.active{background:#FFD700;color:#1a1a2e;border-color:#FFD700}
.tab:hover{background:rgba(255,255,255,0.3)}
#info{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.7);color:#fff;padding:6px 16px;border-radius:20px;font-size:12px;pointer-events:none;z-index:100;backdrop-filter:blur(4px)}
#info span{font-weight:bold;color:#FFD700}
#tooltip{position:fixed;display:none;max-width:420px;background:#1e1e2f;border:1px solid #FFD700;border-radius:8px;padding:10px 12px;color:#fff;font-size:13px;line-height:1.5;z-index:9999;box-shadow:0 8px 24px rgba(0,0,0,0.6);white-space:pre-wrap;word-break:break-word}
#empty{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#888;font-size:13px;text-align:center;line-height:1.8;display:none;pointer-events:none}
.dark-toggle{background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.25);color:#fff;padding:4px 12px;border-radius:16px;cursor:pointer;font-size:12px}
.dark-toggle:hover{background:rgba(255,255,255,0.3)}
[data-theme="dark"] body{background:#0f0f1a;color:#fff}
[data-theme="dark"] #cy{background:#0f0f1a}
[data-theme="dark"] #tooltip{background:#1e1e2f;color:#fff;border-color:#FFD700}
</style>
</head>
<body>
<div class="header">
  <h1>🌐 Graph Viewer</h1>
  <div id="tabs"></div>
  <span class="hint">🔍 호버=메모보기 · 파일명 탭 클릭</span>
  <button class="dark-toggle" onclick="toggleDark()">🌙 다크모드</button>
</div>
<div style="flex:1;display:flex;flex-direction:column;position:relative;min-height:0">
<div id="cy" style="flex:1;min-height:0"></div>
<div id="empty">json 폴더에 JSON 파일을 넣으면<br>탭으로 자동 표시됩니다</div>
</div>
<div id="info">📊 <span id="infoText">로딩 중...</span></div>
<div id="tooltip"></div>
<script>
const GITHUB_REPO = "";
const tabsEl = document.getElementById('tabs');
const infoEl = document.getElementById('info');
const infoText = document.getElementById('infoText');
const tooltip = document.getElementById('tooltip');
const emptyEl = document.getElementById('empty');
let cy = cytoscape({
  container: document.getElementById('cy'),
  elements: [],
  style: [
    { selector: 'node', style: {
      'background-color': 'data(color)', 'label': 'data(label)', 'color': '#fff',
      'text-outline-color': '#000', 'text-outline-width': 2,
      'text-valign': 'center','text-halign': 'center','font-size': 12,'font-weight':'bold',
      'border-width':2,'border-color':'#FFD700','width':110,'height':44,
      'shape': 'round-rectangle','text-wrap':'wrap','text-max-width':'100px'
    }},
    { selector: 'edge', style: {
      'width':2,'line-color':'data(color)','target-arrow-color':'data(color)',
      'target-arrow-shape':'triangle','curve-style':'bezier',
      'label':'data(label)','color':'#111','font-size':11,
      'text-background-color':'#fafafa','text-background-opacity':0.9,'text-background-padding':3,
      'text-outline-color':'#fafafa','text-outline-width':1
    }}
  ],
  layout: { name: 'preset' },
  wheelSensitivity: 0.3
});

function normalize(raw){
  if(!raw) return [];
  if(Array.isArray(raw)) return raw.map(el=>{
    if(el.group==='nodes'){ if(!el.data) el.data={}; if(!el.data.color) el.data.color='#667eea'; if(!el.data.label) el.data.label=el.data.id||''; if(!el.data.shape) el.data.shape='round-rectangle'; if(!el.position) el.position={x:Math.random()*800,y:Math.random()*600}; }
    if(el.group==='edges'){ if(!el.data) el.data={}; if(!el.data.color) el.data.color='#888'; }
    return el;
  });
  if(raw.elements){ if(Array.isArray(raw.elements)) return normalize(raw.elements); if(raw.elements.nodes||raw.elements.edges) return normalize([...(raw.elements.nodes||[]),...(raw.elements.edges||[])])}
  if(raw.nodes||raw.edges){
    const arr=[]; (raw.nodes||[]).forEach(n=>{ if(!n.data) n.data={}; if(!n.data.color) n.data.color='#667eea'; if(!n.data.label) n.data.label=n.data.id||''; const pos=n.position||{x:Math.random()*900,y:Math.random()*600}; arr.push({group:'nodes',data:n.data,position:pos}); });
    (raw.edges||[]).forEach(e=>{ if(!e.data) e.data={}; if(!e.data.color) e.data.color='#888'; arr.push({group:'edges',data:e.data}); });
    return arr;
  }
  if(raw.entities||raw.relations){
    const arr=[]; (raw.entities||[]).forEach(ent=>{ arr.push({group:'nodes',data:{id:ent.name,label:ent.name,color:ent.color||'#667eea',notes:ent.description||''},position:{x:Math.random()*900,y:Math.random()*600}}); });
    (raw.relations||[]).forEach(rel=>{ arr.push({group:'edges',data:{source:rel.from,target:rel.to,label:rel.label||''}}); });
    return arr;
  }
  return [];
}

function loadData(data){
  const elems = normalize(data);
  if(!elems.length){ infoText.textContent='노드/엣지를 찾지 못했습니다'; return; }
  try{ if(typeof cytoscapeFcose !== 'undefined' && typeof cytoscape.use === 'function') cytoscape.use(cytoscapeFcose); }catch(e){}
  const nCount = elems.filter(e=>e.group==='nodes').length;
  let w=110,h=44,fs=12;
  if(nCount>300){ w=70; h=28; fs=10; }
  else if(nCount>150){ w=85; h=34; fs=11; }
  else if(nCount>80){ w=95; h=38; fs=11; }
  cy.style().selector('node').style({'width':w,'height':h,'font-size':fs}).update();
  cy.elements().remove(); cy.add(elems);
  const hasPos = elems.some(el=>el.position && typeof el.position.x==='number');
  cy.resize();
  const useFcose = typeof cytoscapeFcose !== 'undefined';
  const dynLen = Math.min(260, 80 + nCount*0.35);
  const rep = nCount>300 ? 20000 : nCount>150 ? 16000 : 12000;
  const opts = hasPos ? {name:'preset', animate:false}
    : useFcose ? {name:'fcose', animate:false, idealEdgeLength:dynLen, nodeRepulsion: rep, gravity:0.06, numIter:3000, tile:true, packComponents:true, nodeDimensionsIncludeLabels:true, nodeSeparation:60, tilingPaddingVertical:20, tilingPaddingHorizontal:20}
    : {name:'cose', animate:false, idealEdgeLength:dynLen, nodeRepulsion:rep+8000, gravity:0.15, numIter:1500, tile:true, nodeDimensionsIncludeLabels:true, componentSpacing:100};
  const lay = cy.layout(opts);
  lay.on('layoutstop', ()=>{ cy.resize(); cy.fit(null,40); });
  lay.run();
  if(hasPos) setTimeout(()=>{ cy.resize(); cy.fit(null,40); },150);
  infoText.textContent = `노드 ${cy.nodes().length}개 / 엣지 ${cy.edges().length}개`;
}

async function discoverJsonFiles(){
  try{
    const r = await fetch('json/manifest.json', {cache:'no-store'});
    if(r.ok){
      const j = await r.json();
      const files = Array.isArray(j) ? j : (j.files||[]);
      if(files.length) return files.map(f=> typeof f==='string'?f:f.name||f.file);
    }
  }catch(e){}
  try{
    if(GITHUB_REPO && location.hostname.endsWith('github.io')){
      const p2 = location.pathname.split('/').filter(Boolean);
      const sp2 = p2.slice(1).join('/').replace(/\/index\.html$/,'').replace(/\/$/,'');
      const ap2 = sp2 ? `${sp2}/json` : `json`;
      const api = `https://api.github.com/repos/${GITHUB_REPO}/contents/${ap2}`;
      const r = await fetch(api);
      if(r.ok){
        const j = await r.json();
        const files = j.filter(x=>x.type==='file' && x.name.endsWith('.json')).map(x=>x.name);
        if(files.length) return files;
      }
    } else if(!GITHUB_REPO && location.hostname.endsWith('github.io')){
      const parts = location.pathname.split('/').filter(Boolean);
      const repo = parts[0];
      const user = location.hostname.split('.')[0];
      const subPath = parts.slice(1).join('/').replace(/\/index\.html$/,'').replace(/\/$/,'');
      const apiPath = subPath ? `${subPath}/json` : `json`;
      if(repo){
        const api = `https://api.github.com/repos/${user}/${repo}/contents/${apiPath}`;
        const r = await fetch(api);
        if(r.ok){
          const j = await r.json();
          const files = j.filter(x=>x.type==='file' && x.name.endsWith('.json')).map(x=>x.name);
          if(files.length) return files;
        }
      }
    }
  }catch(e){}
  try{
    const r = await fetch('json/', {cache:'no-store'});
    if(r.ok){
      const html = await r.text();
      const matches = [...html.matchAll(/href="([^"]+\.json)"/gi)].map(m=>decodeURIComponent(m[1].split('/').pop()));
      const uniq = [...new Set(matches)].filter(n=>n.endsWith('.json'));
      if(uniq.length) return uniq;
    }
  }catch(e){}
  return [];
}

function esc(s){ return s?String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'):''; }
function showTip(h,x,y){ tooltip.innerHTML=h; tooltip.style.left=(x+15)+'px'; tooltip.style.top=(y+15)+'px'; tooltip.style.display='block'; }
function hideTip(){ tooltip.style.display='none'; }
cy.on('mouseover','node',e=>{
  const d=e.target.data();
  showTip(`<b style="color:#FFD700">${esc(d.label||d.id)}</b><br><small>${esc(d.type||'인물')}</small><br><br>${esc(d.notes||d.memo||d.wiki||d.description||'메모 없음')}`, e.originalEvent.clientX, e.originalEvent.clientY);
});
cy.on('mouseover','edge',e=>{
  const d=e.target.data();
  showTip(`<b>${esc(d.label||'')}</b><br>${esc(d.source)} → ${esc(d.target)}<br><br>${esc(d.notes||'')}`, e.originalEvent.clientX, e.originalEvent.clientY);
});
cy.on('mousemove',e=>{ if(tooltip.style.display==='block'){ tooltip.style.left=(e.originalEvent.clientX+15)+'px'; tooltip.style.top=(e.originalEvent.clientY+15)+'px'; }});
cy.on('mouseout','node',hideTip); cy.on('mouseout','edge',hideTip); cy.on('tap',e=>{ if(e.target===cy) hideTip(); });

function toggleDark(){
  const isDark = document.documentElement.getAttribute('data-theme')==='dark';
  if(isDark){
    document.documentElement.removeAttribute('data-theme');
    document.body.style.background='#fafafa';
    document.getElementById('cy').style.background='#fafafa';
    cy.style().selector('edge').style({'color':'#111','text-background-color':'#fafafa','text-outline-color':'#fafafa'}).update();
  } else {
    document.documentElement.setAttribute('data-theme','dark');
    document.body.style.background='#0f0f1a';
    document.getElementById('cy').style.background='#0f0f1a';
    cy.style().selector('edge').style({'color':'#fff','text-background-color':'#0f0f1a','text-outline-color':'#0f0f1a'}).update();
  }
  setTimeout(()=>{ cy.resize(); cy.fit(null,40); },100);
}

async function init(){
  const files = await discoverJsonFiles();
  if(!files.length){
    emptyEl.style.display='block';
    infoText.textContent='json/*.json 파일을 추가하세요';
    return;
  }
  emptyEl.style.display='none';
  files.sort().forEach((name,i)=>{
    const btn=document.createElement('button');
    btn.className='tab'+(i===0?' active':'');
    btn.textContent=name.replace(/\.json$/,'');
    btn.title=name;
    btn.onclick=async()=>{
      document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      try{
        const r=await fetch('json/'+encodeURI(name), {cache:'no-store'});
        const j=await r.json();
        loadData(j);
        location.hash = encodeURIComponent(name);
      }catch(err){ infoText.textContent='로딩 실패: '+err.message; }
    };
    tabsEl.appendChild(btn);
  });
  const hash = decodeURIComponent(location.hash.slice(1));
  const initial = files.includes(hash) ? hash : files[0];
  const idx = files.indexOf(initial);
  tabsEl.children[idx]?.click();
}
init();
</script>
</body>
</html>
